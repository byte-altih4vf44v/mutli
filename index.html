</head>
<body>
  <main>
    <section class="page-images" aria-label="صور صفحة المنتج">
      <a href="#order" aria-label="الانتقال إلى نموذج الطلب"><img width="941" height="1672" src="assets/01-main.webp" alt="Multi Collagen Peptides — صورة المنتج والعرض الرئيسي" fetchpriority="high" decoding="async"></a>
      <img width="941" height="1672" src="assets/02-why.webp" alt="ما الذي يساعد عليه المنتج ومكوناته" loading="lazy" decoding="async">
      <img width="941" height="1672" src="assets/03-results.webp" alt="نتائج المنتج المعروضة" loading="lazy" decoding="async">
      <img width="941" height="1672" src="assets/04-reviews.webp" alt="آراء عميلات حول المنتج" loading="lazy" decoding="async">
      <a href="#order" aria-label="الانتقال إلى اختيار الباقة"><img width="941" height="1672" src="assets/05-offers.webp" alt="قصص وتجارب وعروض المنتج" loading="lazy" decoding="async"></a>
    </section>

    <section class="order-section" id="order">
      <div class="order-wrap">
        <div class="intro"><h1>اختاري باقتك… وكل ما زادت الكمية زاد التوفير 💗</h1><p>املئي بياناتك لإرسال طلبك — الدفع عند الاستلام</p></div>
        <form id="order-form" class="order-card">
          <fieldset class="offers"><legend class="visually-hidden">اختاري باقتك</legend>
            <label class="offer"><input type="radio" name="offer" value="1" checked><span class="details"><b>1 عبوة</b><small>تكفيك شهر</small></span><span class="price"><strong>189 ريال</strong><del>345 ريال</del></span></label>
            <label class="offer"><input type="radio" name="offer" value="2"><span class="details"><b>2 عبوة</b><small>تكفيك شهرين</small></span><span class="price"><strong>249 ريال</strong><small>وفري 129 ريال</small></span></label>
            <label class="offer"><input type="radio" name="offer" value="3"><span class="details"><b>3 عبوات</b><small>تكفيك 3 أشهر</small></span><span class="price"><strong>290 ريال</strong><small>وفري 277 ريال 🔥</small></span></label>
          </fieldset>
          <div class="fields">
            <label><span class="visually-hidden">الاسم الكامل</span><input name="name" autocomplete="name" placeholder="الإسم الكامل" required minlength="2"></label>
            <label><span class="visually-hidden">رقم الهاتف</span><input name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="رقم الهاتف" required></label>
            <label><span class="visually-hidden">العنوان</span><input name="address" autocomplete="street-address" placeholder="العنوان" required></label>
          </div>
          <p class="check-note">الرجاء التأكد من معلوماتك قبل الإرسال</p>
          <button class="submit" type="submit">إرسال الطلب - الدفع عند الاستلام</button>
          <p id="form-message" class="form-message" role="status" aria-live="polite"></p>
        </form>
        <p class="bottom-note">اطلبي Multi Collagen Peptides الآن واستفيدي من الخصم</p>
      </div>
    </section>
  </main>
  <a class="sticky-order" href="#order" aria-label="شاهدي العرض وانتقلي إلى نموذج الطلب"><span class="sticky-text">شاهدي العرض واطلبي الآن</span><span class="sticky-arrow" aria-hidden="true">↓</span></a>
