name: Verify order receiver

on:
  push:
    paths:
      - ".github/workflows/verify-orders.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Send controlled test order
        shell: bash
        run: |
          set -euo pipefail
          payload='{"transactionId":"MC-VERIFY-20261002-ORDERFLOW","product":"Multi Collagen Peptides","name":"VERIFY_ORDER_FLOW_20261002","phone":"0500000000","address":"TEST - DO NOT FULFILL","offerCode":1,"offer":"باقة البداية — عبوة واحدة، 30 يوم","price":194,"country":"SA","sku":"MULTI-COLLAGEN","currency":"SAR","pageUrl":"https://multicollagenksa.github.io/?verify=orderflow","source":"Landing Page","utm":{"utm_source":"chatgpt-verification"}}'
          echo "Submitting controlled test order..."
          curl --fail --location --silent --show-error \
            -H 'Content-Type: text/plain;charset=utf-8' \
            --data "$payload" \
            'https://script.google.com/macros/s/AKfycbxxBGHE4mZ5iDdplvvaFxVhrHoOMETyRoafgk8iG-DGx9vhY27JgFhc3VHFBO22hu4x0w/exec' \
            -D /tmp/headers.txt -o /tmp/body.txt
          echo "=== RESPONSE HEADERS ==="
          cat /tmp/headers.txt
          echo "=== RESPONSE BODY ==="
          cat /tmp/body.txt
