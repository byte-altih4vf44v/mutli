name: Import exact hero image

on:
  push:
    paths:
      - ".github/workflows/import-hero.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-hero:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download exact uploaded hero image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://d2jqrm6oza8nb6.cloudfront.net/datasets/7b870bfd-dab4-43ca-96e1-37caba42925e.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMjg3ZjQ4MzBiNGI2N2Q5MCIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTEzODk5Mn0.GHUvZrRVAsTagdBlOKPV6VppOs8Edf8G_pEsDIhGra8' \
            --output assets/hero-exact-upload.png
          test -s assets/hero-exact-upload.png
          python - <<'PY'
          from PIL import Image
          p = "assets/hero-exact-upload.png"
          im = Image.open(p)
          assert im.size == (941, 1672), im.size
          print("verified", im.size, im.mode)
          PY

      - name: Commit exact hero image
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/hero-exact-upload.png
          if git diff --cached --quiet; then
            echo "No image changes to commit."
            exit 0
          fi
          git commit -m "Add exact uploaded hero image"
          git push
